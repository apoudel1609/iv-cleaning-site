<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request received — IV Cleaning Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--pine:#0E3B36;--pine-deep:#092A26;--mist:#F2F7F5;--mint:#8FDFCB;--zest:#F4B542;--ink:#14231F;--muted:#5B6E68}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Karla',sans-serif;color:var(--ink);background:var(--mist);
    min-height:100vh;display:grid;place-items:center;padding:1.5rem;text-align:center;
  }
  .card{max-width:30rem}
  .check{
    width:76px;height:76px;border-radius:50%;background:var(--pine);
    color:var(--mint);font-size:2.2rem;display:grid;place-items:center;
    margin:0 auto 1.4rem;
  }
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.8rem,6vw,2.6rem);color:var(--pine-deep);letter-spacing:-.01em;margin-bottom:.7rem}
  p{color:var(--muted);margin-bottom:1.8rem;line-height:1.6}
  .btn{
    display:inline-flex;align-items:center;gap:.5rem;
    padding:.85rem 1.6rem;border-radius:999px;text-decoration:none;
    font-weight:700;background:var(--zest);color:var(--pine-deep);
  }
  .alt{display:block;margin-top:1rem;color:var(--pine);font-weight:700;text-decoration:none}
  .alt:hover{text-decoration:underline}
  :focus-visible{outline:3px solid var(--pine);outline-offset:3px;border-radius:6px}
</style>
</head>
<body>
  <div class="card">
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>Request received!</h1>
    <p>Thank you &mdash; your cleaning request is on its way to Isabel. She&rsquo;ll reach out shortly to confirm your date and final quote.</p>
    <a class="btn" href="/">&larr; Back to the site</a>
    <a class="alt" href="tel:+15046996394">Need it sooner? Call (504) 699-6394</a>
  </div>
</body>
</html>
